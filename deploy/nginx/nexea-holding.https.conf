# /etc/nginx/sites-available/nexea-holding.conf   (STEP 2: after the certificate has been issued)
#
#  - http://nexea-holding.com and http://www.nexea-holding.com  -> https://nexea-holding.com
#  - https://www.nexea-holding.com                              -> https://nexea-holding.com
#  - https://nexea-holding.com                                  -> Next.js on 127.0.0.1:3700
#
# Isolated site file: no global nginx.conf changes. No HSTS header is set (decide that separately once you
# have confirmed every subdomain of nexea-holding.com is served over HTTPS).

server {
    listen 80;
    listen [::]:80;
    server_name nexea-holding.com www.nexea-holding.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://nexea-holding.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nexea-holding.com;

    ssl_certificate     /etc/letsencrypt/live/nexea-holding.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexea-holding.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:nexea_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://nexea-holding.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexea-holding.com;

    ssl_certificate     /etc/letsencrypt/live/nexea-holding.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexea-holding.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:nexea_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3700;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (not append) so a client cannot spoof its address for the app's rate limiting.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Contact form and private-document requests: dynamic, never cached; the email step can take a while.
    location /api/ {
        proxy_pass http://127.0.0.1:3700;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
