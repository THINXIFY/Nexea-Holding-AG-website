# /etc/nginx/sites-available/nexea-holding.conf   (STEP 1: before the certificate exists)
#
# Serves the site over plain HTTP and exposes the ACME challenge path so Let's Encrypt can validate the
# domain. Replace this file with nexea-holding.https.conf once the certificate has been issued.
# This is an isolated site file: it does not touch any other site or the global nginx.conf.

server {
    listen 80;
    listen [::]:80;
    server_name nexea-holding.com www.nexea-holding.com;

    # Let's Encrypt HTTP-01 challenge (webroot mode)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3700;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (not append) so a client cannot spoof its address for the app's rate limiting.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3700;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
        add_header Cache-Control "no-store" always;
    }
}
